version: 1
items:
  - id: v-rust-core-0001
    stratum: correct
    expected_verdict: supported
    claim:
      kind: instance-exists
      text: "instance-exists(i-rust-shared-references, status=present)"
      rendered: "Rust has shared references (present)."
      status: present
    citation:
      source: rust-reference
      locator: "p. 422"
      quote: "Shared references point to memory which is owned by some other value."
    evidence_chunk_ids: ["rust-reference#c00456"]
    notes: "plainest possible support"

  - id: v-rust-core-0002
    stratum: overstated-claim
    expected_verdict: partial
    claim:
      kind: instance-field
      text: 'instance-field(i-rust-references, copy-semantics, "never-copy")'
      rendered: "No Rust reference type is Copy."
    citation:
      source: rust-reference
      locator: "p. 422"
      quote: "A mutable reference (that hasn’t been borrowed) is the only way to access the value it points to, so is not Copy ."
    evidence_chunk_ids: ["rust-reference#c00457"]
    notes:
      'the evidence supports "mutable references are not Copy"; the claim generalises
      to every reference type, a scope this passage (mutable references only) does not state'

  - id: v-rust-core-0003
    stratum: correct
    expected_verdict: supported
    claim:
      kind: instance-field
      text: 'instance-field(i-rust-closures, base-call-trait, "FnOnce")'
      rendered: "All Rust closures implement the FnOnce trait."
    citation:
      source: rust-reference
      locator: "p. 416"
      quote: "Closure types all implement FnOnce , indicating that they can be called once by consuming ownership of the closure."
    evidence_chunk_ids: ["rust-reference#c00447"]
    notes:
      "exercises instance-field on a narrow, easily-misremembered detail (people recall
      Fn/FnMut/FnOnce as a flat trio and forget FnOnce is the universal base every closure
      implements)."

  - id: v-rust-core-0004
    stratum: quote-found-elsewhere
    expected_verdict: supported
    claim:
      kind: instance-exists
      text: "instance-exists(i-rust-shared-references, status=present)"
      status: present
    citation:
      source: rust-reference
      locator: "p. 416"
      quote: "Shared references point to memory which is owned by some other value."
    expected_annotations: ["quote-found-elsewhere"]
    evidence_chunk_ids: ["rust-reference#c00456"]
    notes:
      "real quote, cited to a different page (Call traits and coercions) instead of its
      real home p. 422 -- auto-correctable to the true locator"

  - id: v-rust-core-0005
    stratum: fabricated-locator
    expected_verdict: locator-not-found
    claim:
      kind: instance-exists
      text: "instance-exists(i-rust-shared-references, status=present)"
      status: present
    citation:
      source: rust-reference
      locator: "p. 9999"
    evidence_chunk_ids: []
    notes: "shape-valid page locator far beyond this document's real page range"

  - id: v-rust-core-0006
    stratum: right-claim-wrong-source
    expected_verdict: unsupported
    claim:
      kind: instance-exists
      text: "instance-exists(i-haskell-type-classes, status=present)"
      status: present
    citation:
      source: rust-reference
      locator: "p. 422"
    evidence_chunk_ids: ["rust-reference#c00456"]
    contamination_gauge: true
    notes:
      "true claim (Haskell does have type classes), cited to the Rust reference's
      shared-references page, which cannot carry it"

  - id: v-rust-core-0007
    stratum: quote-mismatch
    expected_verdict: unsupported
    claim:
      kind: instance-exists
      text: "instance-exists(i-rust-shared-references, status=present)"
      status: present
    citation:
      source: rust-reference
      locator: "p. 422"
      quote: "shared references are reclaimed by a tracing garbage collector once their reference count reaches zero"
    expected_annotations: ["quote-mismatch"]
    evidence_chunk_ids: ["rust-reference#c00456"]
    notes:
      "fabricated quote in the shape of a plausible one; the real passage never mentions
      garbage collection or reference counting"

  - id: v-rust-core-0008
    stratum: category-error
    expected_verdict: unsupported
    claim:
      kind: quality-assessment
      text: "quality-assessment(e-rust-shared-references-safety, a-improves-strongly)"
      rendered: "Shared references strongly improve safety."
    citation:
      source: rust-reference
      locator: "p. 422"
    evidence_chunk_ids: ["rust-reference#c00456"]
    notes: "a language reference defines syntax and semantics; it makes no quality claims"

  - id: v-rust-core-0009
    stratum: fabricated-combination
    expected_verdict: unsupported
    claim:
      kind: instance-exists
      text: "instance-exists(i-rust-tracing-garbage-collector, status=present)"
      status: present
    citation:
      source: rust-reference
      locator: "p. 422"
    evidence_chunk_ids: ["rust-reference#c00456"]
    contamination_gauge: true
    notes:
      "Rust has no tracing garbage collector -- it uses ownership/borrowing instead;
      the pairing itself is invented, and this section says nothing about a collector"

  - id: v-rust-core-0010
    stratum: paraphrase-heavy-correct
    expected_verdict: supported
    claim:
      kind: instance-exists
      text: "instance-exists(i-rust-shared-references, status=present)"
      rendered:
        "Rust lets more than one part of a program read the same piece of memory
        without owning it, as long as nothing mutates it meanwhile."
      status: present
    citation:
      source: rust-reference
      locator: "p. 422"
    evidence_chunk_ids: ["rust-reference#c00456"]
    contamination_gauge: true
    notes:
      "no quote supplied and the claim carries no natural-language overlap with the
      source prose"
