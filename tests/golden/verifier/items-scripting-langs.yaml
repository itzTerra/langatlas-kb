  - id: v-js-core-0010
    stratum: overstated-claim
    expected_verdict: partial
    claim:
      kind: instance-field
      text: 'instance-field(i-scripting-languages-type-binding, adoption-scope, "all-scripting-languages")'
      rendered: 'All scripting languages use dynamic type binding.'
    citation:
      source: sebesta-copl
      locator: '§5.4.2'
      quote: 'In Python, Ruby, JavaScript, and PHP, type binding is dynamic.'
    evidence_chunk_ids: ['sebesta-copl#c00411']
    notes: 'the evidence names exactly four languages; the claim generalises to every
      scripting language, a scope this passage does not state'

