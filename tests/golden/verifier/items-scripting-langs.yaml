  - id: v-js-core-0007
    stratum: fabricated-combination
    expected_verdict: unsupported
    claim:
      kind: instance-exists
      text: 'instance-exists(i-javascript-static-type-checking, status=present)'
      status: present
    citation:
      source: sebesta-copl
      locator: '§5.4.2'
    evidence_chunk_ids: ['sebesta-copl#c00309']
    contamination_gauge: true
    notes: 'plain JavaScript (without a superset like TypeScript) has no compile-time
      static type checker; the pairing itself is invented, and this passage says the
      opposite (dynamic type binding)'

  - id: v-js-core-0008
    stratum: quote-mismatch
    expected_verdict: unsupported
    claim:
      kind: instance-field
      text: 'instance-field(i-javascript-type-binding, mode, "dynamic")'
      rendered: 'JavaScript uses dynamic type binding.'
    citation:
      source: sebesta-copl
      locator: '§5.4.2'
      quote: 'the ECMAScript 2020 standard introduced an opt-in static type annotation syntax that the reference implementation enforces at parse time'
    expected_annotations: ['quote-mismatch']
    evidence_chunk_ids: ['sebesta-copl#c00309']
    notes: 'fabricated standards-history quote in the shape of a plausible one; the real
      passage makes no mention of ECMAScript 2020 or a static annotation syntax'

