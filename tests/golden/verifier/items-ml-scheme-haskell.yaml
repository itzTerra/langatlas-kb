      opportunity, not a quality judgment'

  - id: v-scheme-core-0003
    stratum: fabricated-locator
    expected_verdict: locator-not-found
    claim:
      kind: instance-exists
      text: 'instance-exists(i-scheme-tail-recursion, status=present)'
      status: present
    citation:
      source: sebesta-copl
      locator: '§99.5.12'
    evidence_chunk_ids: []
    notes: 'shape-valid numbered section under a chapter number (99) that does not exist in
      this book. An earlier draft used §15.5.99 (a fake child of the real §15.5 section) and
      golden-validate --resolve correctly rejected it as NOT fabricated: the resolver''s
      numbered-section query treats a cited descendant of a real ancestor section as
      resolvable, by design (so citing a real parent section legitimately covers all of its
      real subsections). A fabricated-locator item needs no real ancestor in its chain at all.'

  - id: v-ml-core-0008
    stratum: fabricated-combination
    expected_verdict: unsupported
    claim:
      kind: instance-exists
      text: 'instance-exists(i-ml-hygienic-macros, status=present)'
      status: present
    citation:
      source: sebesta-copl
      locator: '§15.7'
    evidence_chunk_ids: ['sebesta-copl#c01200']
    contamination_gauge: true
    notes: 'ML has no macro system (hygienic or otherwise); the pairing itself is invented,
      and this passage says nothing about it'

  - id: v-haskell-core-0016
    stratum: quote-mismatch
    expected_verdict: unsupported
    claim:
      kind: instance-field
      text: 'instance-field(i-haskell-evaluation-strategy, default-mode, "nonstrict")'
      rendered: 'Haskell uses nonstrict evaluation by default.'
    citation:
      source: sebesta-copl
      locator: '§15.8'
      quote: 'the Haskell committee mandated nonstrict semantics in the 1990 report specifically to enable infinite data structures in scientific computing'
    expected_annotations: ['quote-mismatch']
    evidence_chunk_ids: ['sebesta-copl#c01208']
    notes: 'fabricated historical/motivational quote in the shape of a plausible one; the
      real passage states the fact plainly with no committee narrative or rationale'

