  - id: v-ml-core-0012
    stratum: overstated-claim
    expected_verdict: partial
    claim:
      kind: instance-field
      text: 'instance-field(i-ml-type-declarations, usage-frequency, "never-used")'
      rendered: 'ML type declarations for function parameters are never used, because of type inferencing.'
    citation:
      source: sebesta-copl
      locator: '§15.7'
      quote: 'ML has type declarations for function parameters and the return types of functions, although because of its type inferencing they are often not used.'
    evidence_chunk_ids: ['sebesta-copl#c00893']
    notes: 'the evidence says "often not used"; the claim strengthens this to "never used",
      a certainty this passage does not state'

