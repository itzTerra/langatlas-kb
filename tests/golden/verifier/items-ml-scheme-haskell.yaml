items:
  - id: v-scheme-core-0001
    stratum: correct
    expected_verdict: supported
    claim:
      kind: instance-exists
      text: 'instance-exists(i-scheme-tail-recursion, status=present)'
      rendered: 'Scheme has tail recursion (present).'
      status: present
    citation:
      source: sebesta-copl
      locator: '§15.5.12'
      quote: 'A function is tail recursive if its recursive call is the last operation in the function.'
    evidence_chunk_ids: ['sebesta-copl#c01191']
    notes: 'plain support; the same locus grounds v-scheme-core-0002/0003/0004'

