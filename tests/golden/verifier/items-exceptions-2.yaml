  - id: v-since-0016
    stratum: wrong-since-off-by-one
    expected_verdict: contradicted
    claim:
      kind: instance-field
      text: 'instance-field(i-haskell-pattern-import-keyword, minimum-ghc-version, "present")'
      since: '7.6'
    citation:
      source: ghc-users-guide
      locator: '§6.3.4'
      quote: 'pattern is provided by the PatternSynonyms extension and requires GHC ≥7.8'
    evidence_chunk_ids: ['ghc-users-guide#c00469']
    notes: 'a seventh CONFLICT-branch item off ghc-users-guide, yet another page and
      feature (the pattern import keyword from PatternSynonyms): the page states the
      explicit marker "GHC ≥7.8", opposing the claimed 7.6'
