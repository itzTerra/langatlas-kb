# config/research.yaml — Stage 3 research-phase knobs (context/spec.md §7.4).
# Aliases and model ids are configuration, never code (§7.1). `model: null` on a Claude role
# means "whatever the Claude Code session defaults to"; pin an id here to make a run
# reproducible across a model release.
survey:
  pool:
    # Hybrid-search hits taken per query (theme label, summary, each seed term). Capped at
    # retrieval.candidates in config/ingest.yaml by SourceSearch itself.
    k_per_query: 40
    # Hard ceiling on the frozen pool. The tagging job costs one completion per batch, so
    # this is the knob that bounds a cycle's university-API volume.
    max_chunks: 600
  tagger:
    alias: deepseek                 # volume lane: university API only (D6)
    batch_size: 6                   # chunks per completion call
    min_relevance: 2                # 0-3; below this a chunk never reaches the surveyor packet
  surveyor:
    model: null
    max_turns: 60
    max_claude_messages: 120
    max_packet_terms: 150           # term-index rows handed to the surveyor
    max_candidates: 80              # inventory entries accepted from one run
  scout:
    model: null
    max_turns: 80
    max_claude_messages: 160
    max_packet_terms: 40            # unevidenced candidates handed to the scout
    max_candidates: 30              # source proposals accepted from one run
draft:
  # R4 (Stage 3C). Every role here is Claude-channel: atomization, edge drafting, debate and
  # moderation are judgment work, and D6 keeps judgment off the university API.
  ontologist:
    model: null
    max_turns: 80
    max_claude_messages: 200
    max_packet_terms: 80            # survey candidates handed to the ontologist at once
    max_candidates: 60              # nodes accepted from one run
  edge_drafter:
    model: null
    max_turns: 60
    max_claude_messages: 160
    max_packet_terms: 120           # committed nodes shown to the edge drafter
    max_candidates: 60              # edges accepted from one run
  debate:
    max_messages: 6                 # §7.2's hard cap on a debate's message list
    max_debates_per_cycle: 12       # cost bound; a waiver is the developer's, never an agent's
    personas:
      # Mild and real (§7.2) — no engineered biases. Configuration, so a theme can field
      # challengers who know its literature.
      challenger_a: the type theorist
      challenger_b: the working language implementer
    proposer:
      model: null
      max_turns: 20
      max_claude_messages: 40
      max_packet_terms: 20
      max_candidates: 1
    challenger:
      model: null
      max_turns: 20
      max_claude_messages: 40
      max_packet_terms: 20
      max_candidates: 3             # challenges raised in one message
    moderator:
      model: null
      max_turns: 20
      max_claude_messages: 40
      max_packet_terms: 20
      max_candidates: 1
  verification:
    # Section 6.2's claim-narrowing budget, passed straight to `decide_fact`.
    bounce_budget: 2
controversy:
  # D21/D25 (Stage 3D). The volume lane is the university API's thinker; Claude is only the
  # escalation target and the golden-set calibrator (§6.4/§7.1).
  alias: deepseek-thinking          # deepseek-v4-pro-thinking, per config/provider_capabilities.yaml
  # A record's facts are assessed together and landed in one commit, so this bounds how much
  # of the store one nightly invocation walks. D25's nightly budget is ~200 facts.
  max_facts_per_run: 200
  # Assessment spread only counts as a signal once there is something to disagree about.
  spread_min_assessments: 2
  escalation:
    model: null
    max_turns: 20
    max_claude_messages: 40
    max_packet_terms: 0             # the escalation packet is structured inputs, not terms
    max_candidates: 1
reality_check:
  # R5 (Stage 3E). One Claude session per sampled language: answering a theme's questionnaire
  # for a real language is judgment work (§7.1); verification stays on the university API.
  # R5 mints nothing (D68) — the answers are verified and recorded in the reality check.
  classifier:
    model: null
    max_turns: 80
    max_claude_messages: 160
    max_packet_terms: 60            # questionnaire items one session may be handed
    max_candidates: 10              # uncovered constructs accepted from one session
  # R5 is a shakedown, not a sweep: enough of each field to exercise the pipeline.
  max_characteristics: 1            # per present/partial cell
  max_syntax: 1                     # per present/partial cell
  # Each sampled language's own reference sources, searched first and shown to the checker with
  # their `custom.language_version` — the version an as-of `since` must be (D66). Source records
  # carry no language field, so this is configuration. A sampled language missing here is
  # classified against the general corpus and logged as a `sources` shakedown entry.
  language_sources:
    c: [c23-n3220]
    java: [jls-se25]
    python: [python-langref-3]
    haskell: [haskell-2010-report, ghc-users-guide]
    prolog: [deransart-prolog-1996]
    rust: [rust-fls, rust-reference]
