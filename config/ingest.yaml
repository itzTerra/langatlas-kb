# config/ingest.yaml — D15 ingestion + retrieval knobs.
# Model ids are configuration, never hardcoded: D22's Stage 2 benchmark may replace them
# per table, and the benchmark itself needs several candidates side by side.
chunking:
  target_tokens: 600          # D15: structure-aware 400-800 token chunks
  max_tokens: 800
  overlap_tokens: 60
models:
  embedding: qwen3-embedding-4b     # D15 incumbent for the source corpus until D22 says otherwise
  reranker: qwen3-reranker-4b
  rerank_default_on: true           # D15 ratified: reranker default-on
retrieval:
  k: 5                              # §8.1
  candidates: 50                    # per-branch pool fused by RRF
  # How many of the fused candidates actually reach the reranker. 1B's rerank client is
  # completion-driven and batches 8 documents per call, so reranking all 50 made every
  # search 1 embed + 7 completions = 8 sequential round-trips against a slow API — and
  # §8.6's 40-60-query golden set 320-480 calls against a 500-call provider budget.
  rerank_candidates: 20
  rrf_k: 60                         # standard RRF damping constant
  relevance_floor: 0.0              # §8.1; raised once Stage 2's golden set can measure it
  # Ceiling on the text `get_source_section` returns in one tool result. Sections in the
  # real corpus reach ~19,000 tokens, and raw tool-result injection carries no budget
  # signal at all (embedding/completion calls do), so an uncapped expansion silently
  # fills a Claude-channel context — and D31's transcript log truncates at 2KB, so it
  # would not even show what was injected.
  max_section_tokens: 5000
extraction:
  pdf_backend: pymupdf              # or `docling` (optional extra); see plan assumption
database:
  dsn: postgresql://langatlas:langatlas@localhost:55432/langatlas
goldens:
  # D44 candidate generation runs on a model decorrelated from the D24 verifier's own
  # roster (deepseek / deepseek-thinking primary+escalation, mini as the cross-family
  # second opinion) — a golden set written by the model under test measures agreement,
  # not correctness.
  candidate_model: kimi
  thresholds:
    false_accept_max: 0.02          # §6.2; an FA poisons a public RAG-recycled corpus
    false_reject_max: 0.10          # an FR costs one retry — deliberate asymmetry
  # Dotted `module:attr` path to the D24 verifier factory. Null until 2D ships it;
  # `golden-score` says so plainly rather than scoring nothing and reporting 0%.
  verifier_entry_point: null
  controversy_assessor_entry_point: null
