[project]
name = "langatlas-research"
version = "0.1.0"
description = "LangAtlas research phase — theme cycles, sign-off gate, and the node-minting path"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "ruamel.yaml>=0.18",
  "jsonschema>=4.21",
  "pydantic>=2.7",
  "langatlas-validate",
  "langatlas-commit",
  "langatlas-pipeline",
  "langatlas-ingest",
  "langatlas-finding-aids",
  "langatlas-questionnaire",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
langatlas-research = "langatlas_research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langatlas_research"]

[tool.uv.sources]
langatlas-validate = { path = "../validate", editable = true }
langatlas-commit = { path = "../commit", editable = true }
langatlas-pipeline = { path = "../pipeline", editable = true }
langatlas-ingest = { path = "../ingest", editable = true }
langatlas-finding-aids = { path = "../finding-aids", editable = true }
langatlas-questionnaire = { path = "../questionnaire", editable = true }

[tool.pytest.ini_options]
markers = ["git: creates throwaway git repositories and runs the real commit protocol"]
