# tools/ingest/pyproject.toml
[project]
name = "langatlas-ingest"
version = "0.1.0"
description = "LangAtlas source ingestion, source_chunks store, and pipeline-only retrieval"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "psycopg[binary]>=3.2",
  "pymupdf>=1.24",
  "trafilatura>=2.2,<3",  # backends/html.py hard-depends on 2.x's title/heading-demotion heuristics
  "ruamel.yaml>=0.18",
  "httpx>=0.27",
  "langatlas-validate",
  "langatlas-pipeline",
  "pydantic>=2.7",        # structured entailment output (Section 6.2: JSON, temperature 0)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
docling = ["docling>=2.0"]
# §8.6's local-CPU floor arm (`local:BAAI/bge-small-en-v1.5`) runs through this package's
# own CLI/venv, not `tools/pipeline`'s — so the extra must be re-declared here too, or
# `bench-run`'s local-model arms hit `ModuleNotFoundError: fastembed` even after installing
# it into the pipeline package's own environment.
local-embed = ["langatlas-pipeline[local-embed]"]

[project.scripts]
langatlas-sources = "langatlas_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langatlas_ingest"]

[tool.uv.sources]
langatlas-validate = { path = "../validate", editable = true }
langatlas-pipeline = { path = "../pipeline", editable = true }

[tool.pytest.ini_options]
# `tests/` has no `__init__.py`, so pytest's default import mode inserts only `tests/`
# itself on sys.path, not `tools/ingest`. golden-score's entry points are dotted
# `module:attr` paths (D-whatever "any Python callable"), and the CLI tests resolve one
# against the test module itself (`tests.test_goldens_cli:always_supported`) — that
# import needs `tools/ingest` (this directory) on sys.path too.
pythonpath = ["."]
markers = [
  "db: needs the docker compose Postgres; run with -m db after `docker compose up -d db`",
  "live: hits a real provider; deselected by default",
]
addopts = "-m 'not live'"
