findings:
  - kind: rule-candidate
    detail: "ECMA-262 annotates certain productions with 'no LineTerminator here'. Such an annotation
      has no effect on its own: it only matters because automatic semicolon insertion would otherwise
      supply a terminator at that point. This is an interaction of two features, not a mintable feature,
      so the restricted-production candidate was folded into the ASI node and recorded here."
    keys:
      - automatic-semicolon-insertion
      - restricted-production-no-line-break
  - kind: rule-candidate
    detail: The Haskell layout rule's parse-error side condition closes an implicit group precisely 
      when the next token together with the tokens produced so far is an invalid prefix of the 
      grammar. The effect exists only when a layout-based lexer and the context-free grammar are 
      taken together, which is a rule over two features rather than a property of either.
    keys:
      - layout-rule-offside
      - syntactic-ambiguity
      - compound-statement-block
  - kind: cross-theme-edge
    detail: The reserved underscore lexeme is carved here as a lexical carve-out from the identifier
      rule, but Python, Rust and the Rust FLS define its behaviour as a wildcard pattern that 
      matches any value and binds no name. The matching semantics belong to a 
      pattern-matching/binding theme and should be edged to from this node rather than restated 
      here.
    keys:
      - wildcard-underscore-token
  - kind: cross-theme-edge
    detail: The candidate 'execution-character-set-mapping' was not minted. C and C++ define it as 
      an implementation-defined mapping from source characters to members of the execution character
      set, i.e. a statement about the representation of values at run time, which belongs to a 
      data-representation or semantics theme and only connects to the syntax layer through character
      and string literals.
    keys:
      - source-character-set
      - character-literal
  - kind: structure-friction
    detail: "Several carves are features that specialise other features rather than realising a concept:
      the elsif clause exists only as a repair for keyword end markers, inner versus outer doc comments
      are variants of documentation comments, and terminator elision is a variant of the expression statement.
      'realizes' only points from a feature to a concept, so these specialisations had to be flattened
      into their parent nodes. The model would need a feature-to-feature specialisation relation (or a
      variant/sub-feature record kind) to keep them distinct without inventing a concept for each."
    keys:
      - keyword-end-markers
      - documentation-comments
      - expression-statement
    area: ontology
    element: realizes
  - kind: structure-friction
    detail: Ordered translation phases and the preprocessing layer are not surface constructs a 
      programmer writes, nor are they meaning-of-a-construct facts; they are statements about the 
      order in which syntax rules apply, and they are what make phase-relative carves (preprocessing
      tokens, pre-lexical Unicode escapes) coherent. They were filed as concepts with no layer, but 
      the three-layer scheme has no slot for a translation-pipeline stage, so a layer-0 or an 
      explicit 'specification device' kind would be needed.
    keys:
      - translation-phases
      - preprocessing-as-lexical-layer
      - preprocessing-token
      - unicode-code-point-escape
    area: ontology
    element: layers
  - kind: structure-friction
    detail: Two dimension-model misfits. First, significant indentation is simultaneously a value on
      the statement-grouping axis (layer 3) and a layer-1 lexical mechanism with its own tab-stop 
      and INDENT/DEDENT rules, so one node has to be both a dimension value and a concrete 
      construct. Second, Sebesta names identifier case sensitivity as a primary design issue, which 
      asks for a dimension, but no source read here documents a case-insensitive language, so the 
      axis cannot be given the two member features the model requires and the carve was left at 
      layer 1.
    keys:
      - significant-indentation
      - indent-dedent-tokens
      - identifier-case-sensitivity
    area: ontology
    element: dimension-model
  - kind: structure-friction
    detail: "indent-dedent-tokens and layout-rule-offside are not requirements, enablers or alternatives
      of significant-indentation: each is a concrete mechanism that *realises* the layer-3 feature. The
      five feature-to-feature types cannot express 'specialises/is-a-mechanism-for', so the only honest
      options are to leave the pair unlinked or to misuse requires. A 'specialises' (or layer-crossing
      'realises-feature') type would express it. The same friction holds for brace-delimited-blocks vs
      compound-statement-block, where I was forced to use requires."
    keys:
      - significant-indentation
      - indent-dedent-tokens
      - layout-rule-offside
    area: ontology
    element: edge-types
  - kind: structure-friction
    detail: 'The strongest relations in the operator cluster run from features to the concepts operator-fixity
      and operator-precedence-and-associativity: a fixity declaration simply *is* a way of fixing precedence
      and associativity (haskell-2010-report#c00115), and C# forbids user operators from touching them
      (ecma-334-7th#c00350). Edges may only connect features, so these governing relations are unrepresentable
      and the concept nodes end up orphaned from the features that instantiate them.'
    keys:
      - infix-operator-notation
      - user-defined-operator-fixity
      - operator-overloading
    area: ontology
    element: edge-types
  - kind: rule-candidate
    detail: 'Nestable block comments plus string literals interact: commenting out code with a nested
      comment breaks if an occurrence of the comment delimiters sits inside a string literal or an end-of-line
      comment in that code (haskell-2010-report#c00040). The hazard needs both features present; neither
      alone causes it.'
    keys:
      - nestable-block-comments
      - string-literal
  - kind: rule-candidate
    detail: "Line splicing plus line comments jointly produce a hazard: a backslash at the end of a //
      comment splices the next physical line into the comment, so code silently disappears (c23-n3220#c00208,
      examples '//\\ i(); // part of a two-line comment'). Effect exists only when both features are present."
    keys:
      - line-splicing
      - comment-forms
  - kind: rule-candidate
    detail: 'Mixing layout with explicit braces needs a joint rule: the layout rule matches only the braces
      it inserted, an explicit open brace must be matched explicitly, and inside explicit braces no layout
      processing happens (haskell-2010-report#c00048). This governs the two features together, not either
      one.'
    keys:
      - layout-rule-offside
      - brace-delimited-blocks
  - kind: rule-candidate
    detail: 'Indentation-significant lexing needs a joint rule with the character repertoire: column counting
      assumes a fixed-width font, tab stops 8 characters apart, and that Unicode characters count as one
      ASCII width (haskell-2010-report#c00255). Indentation significance alone does not determine this;
      the character set must be pinned too.'
    keys:
      - layout-rule-offside
      - indent-dedent-tokens
      - source-character-set
  - kind: cross-theme-edge
    detail: "Operator overloading's real dependency is on the type system: operator notation is rewritten
      into function-call notation and resolved by overload resolution over operand types, and at least
      one operand must be of a class or enumeration type (iso-iec-14882-cpp20-n4861#c00712, ecma-334-7th#c00350).
      That requires-edge crosses out of the syntax theme into types/overload resolution."
    keys:
      - operator-overloading
  - kind: cross-theme-edge
    detail: 'The preprocessing cluster reaches into a compilation/metaprogramming theme: directives also
      perform conditional compilation and source inclusion, with #include reprocessing a file through
      phases 1-4 recursively (c23-n3220#c00071). Edges from these nodes to conditional-compilation and
      module/include features belong to that theme.'
    keys:
      - macro-replacement-on-tokens
      - directive-line-syntax
  - kind: unmappable-candidate
    detail: 'Identifier normalization has no node, although every modern spec mandates it and they disagree:
      C, C++ and Rust require Normalization Form C and compare identifiers after normalizing (rust-fls#c00016,
      c23-n3220#c00178), while Python normalizes names to NFKC at parse time (python-langref-3#c00024).
      This is a distinct feature-level choice, not a characteristic of unicode-identifiers.'
    keys:
      - unicode-identifiers
      - identifier-case-sensitivity
  - kind: trimmed
    detail: "Trimmed 2 edges over the cap: Cut the two weakest candidates: \"directive-line-syntax--alternative-to--nestable-block-comments\"\
      \ relies on a single, loosely-related source (scott-plp's scanner discussion of comment delimiters
      doesn't actually discuss directives) and strains the \"alternative-to\" framing; \"token-classes--influences--automatic-semicolon-insertion\"\
      \ is redundant with the better-supported \"automatic-semicolon-insertion--influences--whitespace-as-token-separator\"\
      \ edge, drawing on the identical two Go-spec passages to make a thinner, more peripheral point about
      the same lexical mechanism."
    keys:
      - token-classes--influences--automatic-semicolon-insertion
      - directive-line-syntax--alternative-to--nestable-block-comments
