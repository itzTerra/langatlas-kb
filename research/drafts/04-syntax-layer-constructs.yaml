  - key: abstract-versus-concrete-syntax
    from_candidates:
      - abstract-versus-concrete-syntax
    kind: concept
    id: abstract-versus-concrete-syntax
    name: Abstract versus concrete syntax
    summary: The distinction between the concrete (surface) syntax, the strings of characters 
      programmers read and write, and the abstract syntax, a simpler tree representation of the same
      phrase that elides details needed only for unambiguous analysis.
    evidence:
      - source: pierce-tapl-2002
        locator: pp. 59–60
        chunk_id: pierce-tapl-2002#c00134
        quote: The concrete syntax (or surface syntax ) of the language refers to the strings of 
          characters that programmers directly read and write. Abstract syntax is a much simpler 
          internal representation of programs as labeled trees
      - source: kaijanaho-2015
        locator: §2.3
        chunk_id: kaijanaho-2015#c00057
      - source: harper-pfpl
        locator: p. 23
        chunk_id: harper-pfpl#c00029
    contested: []
