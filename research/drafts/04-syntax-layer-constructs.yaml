    kind: concept
    id: maximal-munch
    name: Maximal munch
    summary: The rule that resolves lexical ambiguity by reading, at each point, the longest 
      character sequence that forms a legal token, so that competing shorter tokenizations are 
      rejected even when they would yield a valid program.
    evidence:
      - source: haskell-2010-report
        locator: §2.2
        chunk_id: haskell-2010-report#c00038
        quote: 'Lexical analysis should use the “maximal munch” rule: at each point, the longest possible
          lexeme satisfying the lexeme production is read.'
      - source: go-lang-spec
        locator: '#Tokens'
        chunk_id: go-lang-spec#c00006
      - source: jls-se25
        locator: §3.2
        chunk_id: jls-se25#c00053
