      verdict: verified
      admissible: true
      pairs: 3
      run_id: 2026-10-25-r4-verify-04-syntax-layer-constructs-02
    note: Minted above the individual ambiguities (dangling else, infix grouping) because the 
      sources treat ambiguity plus disambiguation as one general property of grammars.
  - key: dangling-else-ambiguity
    from_candidates:
      - dangling-else-ambiguity
    kind: concept
    id: dangling-else-ambiguity
    name: Dangling else ambiguity
    summary: The specific grammar ambiguity in which an optional else clause could belong to either 
      of two nested conditionals; languages decree a resolution, typically binding else to the 
      innermost possible if, or rewrite the grammar to exclude one tree.
    evidence:
      - source: jls-se25
        locator: §14.5
        chunk_id: jls-se25#c00718
        quote: The Java programming language, like C and C++ and many programming languages before 
          them, arbitrarily decrees that an else clause belongs to the innermost if to which it 
          might possibly belong.
      - source: sebesta-copl
        locator: §3.3.1
        chunk_id: sebesta-copl#c00276
      - source: scott-plp
