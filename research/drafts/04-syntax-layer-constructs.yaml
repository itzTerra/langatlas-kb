  - key: syntactic-ambiguity
    from_candidates:
      - syntactic-ambiguity
    kind: concept
    id: syntactic-ambiguity
    name: Grammatical ambiguity and disambiguation
    summary: A grammar is ambiguous when some token sequence has more than one parse tree; since 
      meaning is based on syntactic form, languages add extra conditions, rewritten productions or 
      meta-rules that restrict the parser to one tree.
    evidence:
      - source: vanroy-haridi-2003
        locator: §2
        chunk_id: vanroy-haridi-2003#c00125
        quote: Context-free grammars can be ambiguous , i.e., there can be several parse trees that 
          correspond to a given token sequence.
      - source: sebesta-copl
        locator: §3.3.1
        chunk_id: sebesta-copl#c00268
      - source: haskell-2010-report
        locator: §10.1
        chunk_id: haskell-2010-report#c00251
    contested: []
    debate_id:
    status: verified
    verification:
