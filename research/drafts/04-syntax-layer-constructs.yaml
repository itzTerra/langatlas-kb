    assessments:
      - key: brace-delimited-blocks-readability
        polarity: hurts
        strength: moderate
        statement: Terminating every statement group with the same brace diminishes readability, 
          because the reader cannot tell from the closing token which group is being ended.
        evidence:
          - source: sebesta-copl
            locator: §1.3.1
            chunk_id: sebesta-copl#c00056
            quote: All of these languages have diminished readability because statement groups are 
              always terminated in the same way, which makes it difficult to determine which group 
              is being ended when an end or a right brace appears.
