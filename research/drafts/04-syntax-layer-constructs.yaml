    kind: concept
    id: lexical-analysis
    name: Lexical analysis
    summary: The lowest level of syntax analysis, which collects the character stream of a program 
      into logical groupings, discards whitespace and comments, and hands the parser a sequence of 
      tokens.
    evidence:
      - source: sebesta-copl
        locator: §4.2
        chunk_id: sebesta-copl#c00342
        quote: A lexical analyzer serves as the front end of a syntax analyzer. Technically, lexical
          analysis is a part of syntax analysis. A lexical analyzer performs syntax analysis at the 
