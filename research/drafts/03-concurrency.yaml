            chunk_id: scott-plp#c00604
            quote: threads are substantially easier to use, because they eliminate the need for 
              explicit transfer operations
          - source: vanroy-haridi-2003
            locator: §4.4.2
            chunk_id: vanroy-haridi-2003#c00513
            quote: Each coroutine has the responsibility to transfer control often enough so that 
              the others have a chance to execute. If this is not done correctly, then a coroutine 
              might never have a chance to execute.
