findings:
  - kind: rule-candidate
    detail: An exit signal becomes an ordinary mailbox message only when a process link (or explicit
      exit) exists AND the receiver has set its trap-exit flag; neither feature alone produces that 
      effect, and the exit reason 'kill' overrides the trap. The combination, not either feature, is
      what makes supervision work.
    keys:
      - process-link
      - exit-signal-trapping
      - mailbox
  - kind: rule-candidate
    detail: A select construct becomes non-blocking only in combination with a default branch; with 
      buffered channels it also becomes a bounded-concurrency limiter (acquire by send, release by 
      receive), i.e. a semaphore built from two other features.
    keys:
      - select-statement
      - asynchronous-channel
      - semaphore
  - kind: rule-candidate
    detail: Locks and channel operations only establish cross-activity ordering because the memory 
      consistency model designates them synchronisation operations (unlock happens-before subsequent
      lock; send synchronised-before completion of the matching receive). The ordering effect is a 
      property of the pair, not of the lock or channel alone.
    keys:
      - lock
      - channel
      - memory-consistency-model
  - kind: rule-candidate
    detail: Scoped threads can borrow non-static local data only because the join-at-scope-exit 
      guarantee combines with the marker-type/borrow rules; the scope alone does not make the borrow
      sound.
    keys:
      - scoped-threads
      - thread-safety-marker-type
  - kind: cross-theme-edge
    detail: Concurrency-safety marker types (Send/Sync/Sendable) and directional channel types are 
      type-system features; their definition belongs to the types theme while their purpose is here.
    keys:
      - thread-safety-marker-type
      - channel
  - kind: cross-theme-edge
    detail: Coroutines, generators, yield and await are control-flow/continuation constructs shared 
      with the control-flow theme; coroutines-from-continuations in particular is a 
      first-class-continuation result.
    keys:
      - coroutine
      - generator
      - async-await
  - kind: cross-theme-edge
    detail: Fail-fast activities, links and supervision trees connect to the error-handling theme 
      (exceptions, defensive programming) which owns the local-handling alternative they reject.
    keys:
      - fail-fast-crash-only
      - process-link
  - kind: cross-theme-edge
    detail: The distributed tier of the concurrent/parallel/distributed taxonomy (physically 
      separated processors, lost node connections, distributed references) belongs to a distribution
      theme, not here.
    keys:
      - parallelism
      - process-isolation
  - kind: unmappable-candidate
    detail: stream-merger-limitation ('a declarative stream reader must know which producer sends 
      next') is a negative structural claim about streams, not an idea or a construct; it reads as a
      constraint fact attached to stream-communication.
    keys:
      - stream-communication
  - kind: unmappable-candidate
    detail: work-sharing-vs-work-stealing, heavyweight-vs-lightweight-process and 
      cooperative-vs-competitive-concurrency are pairwise comparisons; each was folded into the pole
      the sources define positively, leaving no node for the comparison itself.
    keys:
      - work-stealing
      - process-isolation
  - kind: unmappable-candidate
    detail: 'Candidates I could not evidence in this session and therefore did not mint: virtual-threads,
      lazy-task-creation, load-based-inlining, granularity-of-parallelism, receive-timeout, priority-messages,
      asymmetric-process-monitor, channel-as-counting-semaphore. All look mintable with one more reading
      pass; a thread-weight design axis (kernel-level versus runtime-scheduled lightweight threads) in
      particular is probably a real dimension.'
    keys: []
  - kind: structure-friction
    detail: "generator specialises coroutine: the source defines a generator precisely by a restriction
      on coroutine control transfer ('cannot control where the execution should continue after it yields').
      realizes only points features at concepts, so this feature-specialises-feature relation has nowhere
      to go; the same holds for asymmetric monitors versus bidirectional links and for unbuffered channels
      versus channels."
    keys:
      - generator
      - coroutine
    area: ontology
    element: realizes
  - kind: structure-friction
    detail: Van Roy presents declarative-concurrency, message-passing and shared-state concurrency 
      as alternative computation models a language picks among, i.e. values on one axis. But the 
      sources define them as models/disciplines, which I carved as concepts, and the dimension model
      requires values to be layer-3 features. Either dimensions need to admit concept values, or 
      'model adopted by a language' needs its own record kind.
    keys:
      - declarative-concurrency
      - message-passing
      - mutual-exclusion
    area: ontology
    element: dimension-model
  - kind: structure-friction
    detail: Interleaving semantics, memory consistency models and message ordering guarantees are 
      specifications a language makes about itself, not constructs a programmer writes nor 
      theory-independent ideas. I filed them as concepts, but they behave like per-language 
      guarantee records whose content varies (sequential consistency, DRF-SC, pairwise FIFO); the 
      two layer-3 nodes I minted on racy-program-semantics are a partial workaround.
    keys:
      - interleaving-semantics
      - memory-consistency-model
      - message-ordering-guarantee
    area: ontology
    element: concept-feature-split
  - kind: structure-friction
    detail: The work/span cost model, greedy scheduling bound and busy-leaves space bound are 
      quantitative guarantees about implementations (time within W/P + span, space at most P times 
      serial). Merged into one concept they lose their separate quantitative content; they would be 
      better expressed as measurable qualities or theorem records attached to a scheduler feature.
    keys:
      - work-and-span-cost-model
      - work-stealing
    area: ontology
    element: qualities
  - kind: rule-candidate
    detail: 'Supervision hierarchies need process links and trapping exits together: links propagate the
      exit signal to a whole group, and only a process that has set trap_exit survives to receive it as
      a message and restart the workers. Neither feature alone produces the supervisor effect.'
    keys:
      - process-link
      - exit-signal-trapping
      - spawn
  - kind: rule-candidate
    detail: "Scoped threads give safe borrowing of a parent's locals only in combination with concurrency-safety
      marker types and the borrow discipline: the scope bounds the lifetime while Send/Sync decide what
      may cross the thread boundary. The safety claim holds only for the pair."
    keys:
      - scoped-threads
      - thread-safety-marker-type
  - kind: rule-candidate
    detail: 'async/await only yields concurrency in combination with an executor: an await that suspends
      the task is useful only because the executor can run other submitted jobs on that thread meanwhile,
      and the task resumes on the executor it started on.'
    keys:
      - async-await
      - executor
  - kind: rule-candidate
    detail: 'Asynchronous generators arise only from async/await and generators together: a yield expression
      inside an async def function defines an asynchronous generator whose methods return awaitables.
      Neither feature alone has this effect.'
    keys:
      - async-await
      - generator
  - kind: structure-friction
    detail: Several pairs stand in a specialisation ('refines' / 'is a restricted form of') relation
      that none of the five edge types expresses. Van Roy & Haridi say monitors refine locks with 
      wait points and transactions refine locks with a commit/abort exit, and the Python reference 
      says a generator differs from a coroutine only in that it cannot control where execution 
      continues after it yields. I had to force 'requires' for monitor->lock and omit 
      atomic-block->lock and generator->coroutine entirely. A 'specialises'/'refines' edge type 
      would express these.
    keys:
      - monitor
      - lock
      - atomic-block
      - generator
      - coroutine
    area: ontology
    element: edge-types
  - kind: structure-friction
    detail: "Unbuffered and buffered channels (layer 3) are variants of the layer-2 channel node, and
      selective receive is a variant of plain receive; the only available type for the variant/parent
      relation is 'requires', which overstates it. Likewise several well-sourced relations in this theme
      point at concept nodes that are not legal endpoints: dataflow variables enable declarative concurrency,
      select introduces observable nondeterminism, actor isolation realises process isolation, work stealing
      underlies thread pools. These are among the most frequently stated claims in the literature and
      currently have nowhere to go."
    keys:
      - synchronous-channel
      - asynchronous-channel
      - channel
      - dataflow-variable
      - select-statement
    area: ontology
    element: edge-types
  - kind: cross-theme-edge
    detail: thread-safety-marker-type is a type-system feature (auto-derived marker traits, 
      type-level data-race prevention) and belongs partly to a Types theme; its edge to thread 
      crosses themes.
    keys:
      - thread-safety-marker-type
  - kind: cross-theme-edge
    detail: undefined-behavior-on-data-race and constrained-semantics-for-racy-programs are 
      memory-model / undefined-behaviour features; C23 lists a data race among its undefined 
      behaviours alongside unrelated UB, so these nodes also sit in a Memory-and-safety theme.
    keys:
      - undefined-behavior-on-data-race
      - constrained-semantics-for-racy-programs
  - kind: cross-theme-edge
    detail: 'async-await, coroutine and generator connect to control-flow and iteration features outside
      Concurrency: Python generators are the iteration protocol, and C++ co_await is an expression form
      with its own suspension-context rules in the expression grammar.'
    keys:
      - async-await
      - coroutine
      - generator
  - kind: cross-theme-edge
    detail: "atomic-block connects to error handling: a transaction's exceptional exit is an abort that
      undoes its state changes, and GHC's STM exposes retry/orElse as composition operators, so the edge
      touches an Error-handling theme."
    keys:
      - atomic-block
