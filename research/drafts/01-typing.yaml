  - kind: structure-friction
    detail: "The single-source flag that triggered this debate is resolved: five independent textbook
      sources (Van Roy & Haridi, Turbak & Gifford, Scott, Sebesta, Jordan et al., plus Cardelli & Wegner)
      converge on static/dynamic typing as a named design-time choice about when and how type-compatibility
      is checked, at the same granularity the carve asserts. No participant disputes the underlying factual
      content.\n\nHowever, challenger-b's wrong-structure challenge is upheld. The carve's statement frames
      the alternative-to edge as a mutually exclusive either/or, but the same anchor source cited for
      the carve immediately qualifies that: \"The choice between static or dynamic typing does not have
      to be all or nothing... a bit of the other can be added\" (Van Roy & Haridi §2.7.3), and Harper
      (PFPL) describes hybrid typing where the two \"coexist harmoniously,\" with dynamic typing characterized
      as \"a mode of use of static typing\" (p. 235). Krishnamurthi documents this as a shipped, non-exclusive
      design category (Typed Racket, TypeScript, Static Python; p. 174), not an edge case. The proposer
      conceded this directly. This is a real disagreement about what the evidence shows, resolved in the
      challenger's favor by the proposer's own anchor source — not merely a disagreement between agents.\n\
      \nResolution at the carve level: reword the statement to drop the exclusive-choice framing while
      preserving the legitimate \"two major families/poles\" classification that most languages still
      fit, and broaden evidence beyond the single source. This keeps the edge's factual core (most languages
      are classifiable as predominantly static or dynamic, and designers do treat it as a consequential
      choice) without asserting strict mutual exclusivity the sources contradict.\n\nThis does not fully
      resolve the deeper structural gap challenger-b identifies: the ontology currently has no node/edge
      for gradual or hybrid typing as a first-class third design point distinct from either pole, so the
      alternative-to relation is still being asked to carry a load (a clean binary) that the corpus shows
      is populated in the middle for real shipped languages. That gap is a dimension-model / edge-types
      question for the structure review, not something a statement reword fully discharges — hence standing
      dissent remains live even after this revision."
