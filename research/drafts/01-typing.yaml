    verification:
    note: ''
    drop_reason: Ad hoc polymorphism is, in every cited source (Cardelli & Wegner, Pierce TAPL 
      §23.2, Turbak & Gifford, and the Haskell Report that frames it as "ad hoc polymorphism, or 
      overloading"), a branch of a theoretical taxonomy of polymorphism — a concept per LangAtlas's 
      own vocabulary — not a feature with independent functional criteria. Type classes 
      realize/instantiate it; they do not "require" it as a dependency the way one feature requires 
      another to function. A feature-to-feature `requires` edge cannot correctly express a 
      concept-realization relationship, and the proposer concedes this after re-reading their own 
      corroborating citations. The edge should be retracted and the relationship remodeled as a 
      concept→feature realizes/is-a-kind-of relation (with `ad-hoc-polymorphism` recast as a concept
      node), not patched within the current feature-feature edge type.
