  - key: dynamic-typing
    from_candidates:
      - dynamic-typing
    kind: feature
    id: dynamic-typing
    name: Dynamic Typing
    summary: "A typing discipline in which values are tagged with type/class information inspected at
      run time, with type errors checked only when an operation is about to occur; type errors thus surface
      at run time rather than compile time. The value-vs-phrase boundary used here is itself contested
      in the corpus: Harper (PFPL §24.4) argues this criterion does not cleanly distinguish dynamic from
      static typing, since tagging values with classes 'amounts to a use of recursive sum types within
      a statically typed language.'"
    evidence:
      - source: turbak-gifford-dcpl
        locator: §11.3.1
        chunk_id: turbak-gifford-dcpl#c00958
      - source: harper-pfpl
        locator: §23.3
        chunk_id: harper-pfpl#c00355
      - source: scott-plp
        locator: pp. 425–426
        chunk_id: scott-plp#c00398
        quote: Dynamic (run-time) type checking is a form of late binding
    contested:
      - new-dimension
    debate_id: d-01-typing-015
    status: verified
    verification:
      fact_id: f-85e88d2d41cd
      verdict: verified
      admissible: true
      pairs: 3
      run_id: 2026-10-18-r4-verify-01-typing-01
    note: Historically paired with static-typing, but the corpus does not support modeling the two 
      as symmetric, mutually exclusive poles of one axis. Van Roy & Haridi describe a continuum 
      rather than an either/or ('the choice... does not have to be all or nothing... a bit of the 
      other can be added'), and Harper formally argues dynamic typing is a restricted/degenerate 
      mode of use of static typing (a uni-typed language built on one recursive sum type), not an 
      independent alternative value ('dynamic typing is a mode of use of static typing'). The 
      dimension relationship should be read as permitting subsumption/coexistence, not strict 
      exclusivity; this is a modeling concern for the dimension structure generally, not unique to 
      this node.
    dimension: static-dynamic-typing-discipline
    cross_cutting: false
    aliases:
