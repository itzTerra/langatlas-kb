  - kind: structure-friction
    detail: "The underlying distinction is solid: Pierce (TAPL §19.3) names \"nominal\" and \"structural\"\
      \ as the two terms for a type system's subtyping/equivalence judgment, and Sebesta's independently-sourced
      \"type equivalence\" split (name vs. structure) corroborates it. Krishnamurthi's worked Java example
      shows the choice has concrete, observable consequences. No participant contests that structural-vs-nominal
      is a real, load-bearing axis in the domain, and challenger-b found no defect in the carve's sourcing,
      layer placement, or atomization.\n\nThe challenge that is upheld is narrower and structural: the
      carve's `exclusivity: exclusive` combined with `applies_to: ['general-purpose']` asserts one value
      of the axis per whole language, but the cited evidence (Sebesta §6.15 on C: name equivalence for
      struct/enum/union, structure equivalence for arrays, plus a file-boundary exception; Sebesta on
      Ada: structure equivalence for unconstrained arrays alongside three different strictness levels
      of name equivalence for derived types/subtypes/anonymous types) shows real languages mixing the
      two mechanisms by type-construct category within a single language. The proposer, after searching,
      could not locate a Pierce passage actually backing the language-level-exclusive framing attributed
      to him in the note, which removes the strongest piece of support for that framing. This is a genuine
      mismatch between what the ontology's per-language exclusive-value slot can express and the grain
      at which the evidence actually varies — a dimension-model gap, not a flaw in the carve's identification
      of the axis itself.\n\nPer the handling rule for upheld wrong-structure challenges, the carve is
      kept on its own merits (the axis is real and well-evidenced) while the structural gap is flagged
      for the structure review: the dimension-model needs either (a) a `mixed`/`combination` value usable
      alongside `structural`/`nominal` for languages whose construct categories differ, or (b) a way to
      scope `exclusivity` at a grain finer than \"per language\" — e.g., per type-construct category (record/struct,
      array, enumeration, etc.) — since that is the granularity at which C and Ada's documented behavior
      actually resolves to a clean exclusive choice. Until the dimension-model is extended with one of
      these mechanisms, any carve using whole-language `exclusivity: exclusive` will misclassify languages,
      like C and Ada, that mix rules by construct — so the challenger's underlying objection about accuracy
      for those languages remains live even though the carve itself is not being altered here."
