      language — a static language enriched with a type `dyn` — and says nothing about annotation, incrementality,
      or migration, the properties that make this a dependency rather than coexistence. The implementer's
      reductio from #c00373 (Java, Haskell, OCaml, SML \"include a type similar to dyn\") is decisive:
      if a dyn-like mode were evidence about gradual typing, Harper would be committed to SML being gradually
      typed. Harper's #c00343/#c00346 also fix his \"dynamic typing\" as a restricted static discipline,
      not the corpus sense (turbak-gifford-dcpl#c00958). The four Krishnamurthi chunks are one continuous
      section run; they corroborate but do not multiply the source. Flag stands.\n\nWrong-atomization
      is upheld on the cited passage's own face: #c00241 is titled \"Micro Versus Macro,\" opens \"there
      are two schools of thought,\" and attaches materially different consequences to each (unclear soundness
      and untypeable constructs in micro; a value-crossing import boundary and differing construct sets
      in macro). A disjunction inside one statement records that split as wording rather than structure.
      Both challengers and, on re-reading, the proposer converge here; the convergence is grounded in
      the passage, not in deference.\n\nWrong-structure is also upheld on #c00242: under macro the bearer
      of gradual typing is neither Racket nor Typed Racket but their combination, which is not \"a particular
      language\" and therefore has no feature-instance slot. I keep the carve rather than dropping it
      because the micro half is a genuine same-bearer feature-to-feature `requires` — #c00240 grounds
      the dynamic remainder in the language lacking a static discipline, so the `to` side is a discipline
      and not a mere absence of annotations. I reject the type theorist's framing of micro's remainder
      as only \"an unannotated remainder\"; #c00240 does not support that reading.\n\nThe carve is therefore
      narrowed to the micro branch. For the structure review: holding the macro claim would require a
      record kind whose bearer is a language pair (or a cross-artifact edge type between two feature instances
      in different languages, with the value-crossing boundary and divergent construct sets as its payload).
      Until that exists, the macro dependency is unrecorded.\n\nStanding dissent is recorded: the macro
      dependency, which the source treats as the canonical school, is left out of the knowledge base by
      this decision, and the single-source flag on what remains is live."
