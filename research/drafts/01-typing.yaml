    drop_reason: "merged into structural-typing: Both missing-source challenges and the wrong-atomization
      challenge are upheld; the proposer conceded all three after re-checking the passages, and the record
      bears this out.\n\n(1) The carve's listed evidence chunk krishnamurthi-plai#c00232 is a 'Do Now'/exercise
      prompt about representing a tree method in Java — it never mentions duck typing or structural typing,
      so the carve's primary citation does not support its own summary. The sentence that actually motivates
      the carve (\"the Internet appears to have decided to call this 'duck' typing... there is no actual
      theory of duck typing to compare against well-defined theories of structural typing\") is krishnamurthi-plai#c00235,
      which the carve never cites.\n\n(2) The second evidence item, scott-plp pp. 425–426 (#c00398, and
      the related #c00680), never uses \"duck typing\" or any synonym anywhere — it is Scott's general
      treatment of dynamic type checking and late-bound polymorphism. The proposer's \"straddles two literatures\"\
      \ argument — the load-bearing reason given for minting a standalone, dual-rooted node rather than
      folding the term under one parent — rested on pairing this passage with the duck-typing summary
      by thematic analogy (both are runtime checks), not on any source that calls this mechanism \"duck
      typing.\" That manufactured second anchor is exactly what justified `cross_cutting: True` and the
      refusal to pick a parent; with it gone, the sourced claim collapses to a single anchor.\n\n(3) With
      only krishnamurthi-plai#c00235 standing, the sole source that actually names the term explicitly
      denies it has a corresponding theory (\"no actual theory of duck typing to compare against well-defined
      theories of structural typing\") and scopes it exclusively to structural typing. Per the project's
      own feature definition (\"a realisation of a concept within a family of related systems\"), a term
      whose only citing source denies it has a theory of its own is not a second feature realization —
      it is a colloquial alias for the feature structural-typing already names. The carve's own note flagged
      this exact doubt and resolved it the wrong way, propped up by the now-refuted scott-plp anchor.\n\
      \nResolution, per the converged position of proposer and both challengers: fold \"duck typing\"\
      \ into `structural-typing` as an alias/informal-name fact, citing only krishnamurthi-plai#c00235,
      with text close to the source (an informal/colloquial Internet name, with no attendant theory, used
      loosely for structural typing). Drop the scott-plp#c00398 citation and the cross_cutting/dual-realizes
      framing that depended on it. No standing dissent — all three debate participants agree on this outcome
      after inspecting the primary sources."
