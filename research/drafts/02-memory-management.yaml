findings:
  - kind: structure-friction
    detail: automatic-reference-counting-objc and cyclic-reference-counting each specialise the 
      feature reference-counting-gc (add compiler-inserted retain/release, or add trial-deletion 
      cycle collection) rather than realising a distinct concept; the realizes relation only 
      connects feature->concept, so this feature-specialises-feature link cannot be expressed and 
      had to be dropped or redirected to a looser concept target.
    keys:
      - automatic-reference-counting-objc
      - cyclic-reference-counting
    area: ontology
    element: realizes
  - kind: rule-candidate
    detail: 'Generational garbage collection has no effect on its own: it requires pairing with at least
      one member of the gc-collector-algorithm dimension (mark-sweep, semispace-copying or mark-compact)
      to actually collect each generation. The interaction, not either feature alone, is what the sources
      describe (e.g. copying nursery + mark-compact old generation).'
    keys:
      - generational-garbage-collection
      - mark-sweep-collection
      - semispace-copying-collection
      - mark-compact-collection
  - kind: rule-candidate
    detail: A card-table remembered set is only meaningful in combination with both a write barrier 
      (to dirty cards) and a generational or regional collector (to consult the table when 
      scanning); none of the three alone produces the described cross-region-pointer tracking.
    keys:
      - card-table-remembered-set
      - write-barrier
      - generational-garbage-collection
  - kind: cross-theme-edge
    detail: Ownership, borrowing, move-semantics and substructural-types (linear/affine) are as much
      a type-system discipline as a memory-management one; the Rust FLS and ATTAPL sources frame 
      them primarily as static typing/substructural-logic machinery that happens to govern storage 
      reclamation as a side effect. A 'type systems' theme will want to claim some or all of these 
      too.
    keys:
      - ownership
      - borrowing
      - move-semantics
      - substructural-types
  - kind: cross-theme-edge
    detail: Escape analysis is a general compiler-optimisation technique (also used for lock 
      elision) that this theme only sees through its memory-allocation consequence (stack allocation
      of would-be-heap objects). A compiler-optimisations theme will likely also want this node.
    keys:
      - escape-analysis
      - stack-allocation-of-heap-objects
  - kind: cross-theme-edge
    detail: 'Distributed garbage collection (and its folded-in weighted-reference-counting / time-lease
      mechanisms) sits at the boundary with a distributed-systems/concurrency theme: the reclamation problem
      is memory management but the solutions (credits, leases, failure detection) are distributed-systems
      techniques.'
    keys:
      - distributed-garbage-collection
  - kind: structure-friction
    detail: Several surveyor leads bundle a whole policy space under one gloss without 
      separately-evidenced member values (allocator-fit-policy's first/next/best-fit, 
      compaction-order's arbitrary/linearising/sliding). These were folded as notes into a sibling 
      node (free-list-allocation, mark-compact-collection) rather than minted as their own 
      dimension, because the model requires at least two independently evidenced member features to 
      open a dimension and the survey only evidences the bundling concept, not its individual 
      values.
    keys:
      - free-list-allocation
      - mark-compact-collection
    area: ontology
    element: concept-feature-split
  - kind: rule-candidate
    detail: Generational collection is only correct in combination with both a write barrier on 
      pointer stores and a remembered-set structure (e.g. a card table); neither feature alone 
      produces the effect, and the barrier itself is modelled as a concept, not a feature.
    keys:
      - generational-garbage-collection
      - card-table-remembered-set
      - insertion-barrier
  - kind: rule-candidate
    detail: Conservative pointer finding combined with a moving collector yields the 
      'mostly-copying' behaviour only when heap objects additionally carry layout information and 
      ambiguously-referenced objects are pinned — an interaction of conservative scanning plus 
      copying, not a property of either alone.
    keys:
      - conservative-garbage-collection
      - semispace-copying-collection
      - accurate-pointer-finding
  - kind: rule-candidate
    detail: Reclaiming cyclic garbage under reference counting needs reference counting plus either 
      trial-deletion cycle collection or disciplined weak references; the combination determines 
      whether cycles leak or are reclaimed.
    keys:
      - reference-counting-gc
      - cyclic-reference-counting
      - weak-reference
  - kind: structure-friction
    detail: Buddy-system allocation is described in the literature as a special case of segregated 
      fits (size classes with rounding plus a restricted splitting/coalescing rule). None of the 
      five types expresses 'specialises'; 'alternative-to' was used for its competition with general
      free-list allocation instead, which loses the containment relation.
    keys:
      - buddy-system-allocation
      - segregated-fits-allocation
    area: ontology
    element: edge-types
  - kind: structure-friction
    detail: Bitmapped-fits allocation is a sequential-fits strategy that replaces only the free-cell
      search mechanism of free-list allocation; the relation is 'is a variant/refinement of', not 
      rivalry or enablement.
    keys:
      - bitmapped-fits-allocation
      - free-list-allocation
    area: ontology
    element: edge-types
  - kind: structure-friction
    detail: "Several edges the sources state plainly cannot be drawn because the required endpoint is
      a concept: generational and concurrent collectors require a write barrier; moving concurrent collectors
      require a read barrier; conservative collection causes space leaks. There is also no generic 'tracing
      garbage collection' feature node to anchor requires-edges from finalizer, weak-reference or stack-map,
      which currently have to be attached to specific algorithms (mark-sweep, copying) instead."
    keys:
      - write-barrier
      - read-barrier
      - finalizer
      - stack-map
    area: ontology
    element: concept-feature-split
  - kind: cross-theme-edge
    detail: Compiler-driven stack allocation depends on escape analysis, a static program analysis; 
      the enabling relation crosses into the compilation/static-analysis theme rather than memory 
      management.
    keys:
      - stack-allocation-of-heap-objects
      - escape-analysis
  - kind: cross-theme-edge
    detail: 'Trail and choice-point reclamation is driven by backtracking control flow in logic languages:
