unevidenced:
  - key: type-erasure
    name: Type Erasure
    gloss: Implementing generics by discarding type-parameter information after compile-time 
      checking, so a single runtime representation serves all instantiations.
    origin: prior
    search_hint: Java Language Specification generics chapter or Gosling et al. JLS §4.6/erasure 
      discussion; Bracha et al. 'Making the Future Safe for the Past' (GJ paper)
    disposition: scouted
  - key: row-polymorphism
    name: Row Polymorphism
    gloss: A polymorphism mechanism abstracting over the remaining, unspecified fields of a record 
      or variant type, common in OCaml objects and some functional languages.
    origin: prior
    search_hint: Rémy 1989 'Type checking records and variants in a natural extension of ML'; OCaml 
      manual chapter on polymorphic variants/objects
    disposition: scouted
  - key: refinement-types
    name: Refinement Types
    gloss: Types annotated with logical predicates that further constrain the set of values a base 
      type may take, checked via an SMT solver or similar.
    origin: prior
    search_hint: Freeman & Pfenning 1991 'Refinement types for ML'; Liquid Haskell / Rondon, 
      Kawaguchi, Jhala 2008 PLDI paper
    disposition: scouted
  - key: type-classes-erlang-dialyzer
    name: Success Typing (Dialyzer)
    gloss: A gradual, unsound-by-design static analysis for dynamically typed Erlang code that 
      infers types only well enough to certainly flag definite type errors.
    origin: finding-aid-gap
    search_hint: Lindahl & Sagonas 2006 'Detecting Erlang Defects... Success Typings'; Erlang/OTP 
      Dialyzer documentation
    disposition: scouted
theme_amendments: []
scouting:
  - source_id: bracha-odersky-stoutamire-wadler-1998
    title: 'Making the Future Safe for the Past: Adding Genericity to the Java Programming Language'
    csl_type: paper-conference
    url: https://homepages.inf.ed.ac.uk/wadler/gj/Documents/gj-oopsla.pdf
    doi: 10.1145/286936.286957
    issued_year: 1998
    authors:
      - Bracha, Gilad
      - Odersky, Martin
      - Stoutamire, David
      - Wadler, Philip
    tier: A
    grounding: design-doc
    access: open
    candidate_keys:
      - type-erasure
    rationale: This is the original GJ paper that introduced and designed the type-erasure 
      translation for adding generics to Java by discarding type-parameter information after 
      compile-time checking, and is cited by the JLS itself as the historical source of erasure/raw 
      types; the corpus has the current JLS spec text but not this originating design paper 
      explaining the erasure rationale and mechanism.
    status: filed
    queue_entry_id: 17
  - source_id: remy-1989
    title: Type checking records and variants in a natural extension of ML
    csl_type: paper-conference
    url: https://www.cs.tufts.edu/~nr/cs257/archive/didier-remy/type-checking-records.pdf
    doi: 10.1145/75277.75284
    issued_year: 1989
    authors:
      - Rémy, Didier
    tier: A
    grounding: formal-spec
    access: open
    candidate_keys:
      - row-polymorphism
    rationale: The founding POPL '89 paper that introduces row-typed polymorphism over 
      record/variant fields with presence information, the direct theoretical origin of row 
      polymorphism as later used in OCaml's polymorphic variants and objects; the corpus's ATTAPL 
      chapter on rows discusses the mechanism generically but does not include this originating 
      paper.
    status: filed
    queue_entry_id: 18
  - source_id: freeman-pfenning-1991
    title: Refinement Types for ML
    csl_type: paper-conference
    url: https://www.cs.cmu.edu/~fp/papers/pldi91.pdf
    doi: 10.1145/113445.113468
    issued_year: 1991
    authors:
      - Freeman, Tim
      - Pfenning, Frank
    tier: A
    grounding: formal-spec
    access: open
    candidate_keys:
