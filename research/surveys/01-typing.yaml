    rationale: The seminal PLDI '91 paper that originated refinement types as decidable 
      sub-datatypes obtained by restricting constructors, the direct ancestor of the modern 
      refinement-type concept; not present in the existing corpus, which only touches related 
      dependent/intersection type material.
