theme_amendments:
  - op: edit
    slug: concurrency
    summary: Models for concurrent and parallel execution, the activities they introduce (threads, 
      processes, actors, tasks, coroutines), the communication and synchronization they imply 
      (shared state with locks, monitors and transactions; message passing over ports, mailboxes and
      channels; dataflow synchronization; anonymous coordination media), the ordering guarantees 
      languages specify for them, and the correctness and progress hazards these mechanisms address 
      (races, deadlock, starvation, liveness) together with the cost model of parallel execution.
    seed_terms:
      - ABA problem
      - test-and-test-and-set and contention backoff
      - atomicity versus condition synchronization
      - competition versus cooperation synchronization
      - process calculi
      - vector timestamps and causal ordering
      - composability of atomic abstractions
      - data-sharing attributes (private, shared, firstprivate)
      - execution policies for parallel library algorithms
      - implicit atomicity between synchronisation points
      - modification order and coherence
      - spark-based speculative parallelism
    rationale: 'The corpus substantively defines several ideas within this theme that the seed list does
      not name, and which the ontologist would otherwise have no term hook for: the ABA problem and test-and-test-and-set
      as named hazards/techniques around compare-and-swap (jones-hosking-moss-2012#c00671, #c00660); the
      distinction between atomicity and condition synchronization, and between competition and cooperation
      synchronization, which several textbooks use as the organising axis for the whole area (scott-plp#c00832,
      sebesta-copl#c01074); process calculi as an abstract model of interaction alongside CSP and actors
      (harper-pfpl#c00648); vector/causal timestamps as distinct from Lamport clocks (fidge-1988-timestamps#c00001);
      non-composability of lock-based abstractions as the stated motivation for transactional memory (scott-plp#c00872);
      declared data-sharing attributes (private/shared/firstprivate) as a first-class language mechanism
      for avoiding races (openmp-api-6-0#c00065); and execution policies / weakly-parallel forward progress
      for library algorithms (iso-iec-14882-cpp20-n4861#c02128).'
    status: rejected
