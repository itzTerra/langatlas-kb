theme_amendments:
  - op: edit
    slug: syntax-layer-constructs
    seed_terms:
      - punctuators and separators
      - matched delimiter pairs
      - compound punctuator splitting
      - parse tree versus derivation
      - alternative token spellings and digraphs
      - quoted atoms and quoted identifiers
      - character conversion tables
      - literate source conventions
    rationale: Several corpus sources (C, Java, Rust FLS, Rust reference) devote dedicated sections 
      to punctuators/separators/delimiter pairs and to compound-punctuator splitting, and textbooks 
      (Sebesta, Scott) define parse trees and derivations as distinct from abstract syntax trees. 
      Neither notion is named in the current seed list, yet both are substantively defined within 
      this theme's literature.
    status: rejected
