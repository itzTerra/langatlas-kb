      it within a FunctionParameter's TypeSpecification and a FunctionDeclaration's ReturnType [rust-fls#c00061],
      yet Rust permits no omission of a parameter annotation at all. Within one language the written placeholder
      and the omitted annotation are legal in different positions; one feature cannot have two distributions.
      The in-source corroborant the proposer himself offered is the passage that most sharply refuses
      the identification: TAPL §22.6 prefers un-annotated abstractions in the term syntax over \"a bare
      abstraction ... annotated with an invisible type variable\" precisely because the latter mis-handles
      let-polymorphism [pierce-tapl-2002#c00708]. The internal inference variable [rust-fls#c00085] is
      nothing written and is not a surface feature at all.\n\n(2) Scope/mechanism. Challenger-b's evidence
      shows the statement's mechanism clause is false of the feature's commonest instances: C++ omits
      nothing — the declaration carries a placeholder-type-specifier and the type \"is deduced from its
      initializer\" [iso-iec-14882-cpp20-n4861#c00417] by template-argument-deduction rules [iso-iec-14882-cpp20-n4861#c00422],
      not constraint generation over a term's uses; C# `var` requires an initializer [ecma-334-7th#c00597],
      as does Java's. Challenger-a's gradual-typing counterexample is also sourced and real against the
      *original* statement: Python's annotation slot is optional per-position and \"not enforced by the
      language\" [python-langref-3#c00333], with unannotated positions left dynamic rather than reconstructed
      [krishnamurthi-plai#c00241].\n\nRemedy. I take the narrowing rather than challenger-a's proposed
