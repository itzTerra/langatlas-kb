      prior to, and independently of, execution\" [pierce-attapl-2004#c00469].\n- Failure to determine
      is a compile-time error, not a runtime fallback — the sharpest available proof that the placeholder
      cannot live outside a static discipline: \"[i]f the deduction fails, the declaration is ill-formed\"\
      \ [iso-iec-14882-cpp20-n4861#c00423]; \"if the type that replaces the placeholder type is not the
      same in each deduction, the program is ill-formed\" [iso-iec-14882-cpp20-n4861#c00418]. Contrast
      [python-langref-3#c00333], where the annotation slot carries no such consequence — which is exactly
