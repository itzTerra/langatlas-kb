      specifically, not the feature as a whole.\n\n### What I ask the moderator to record\n\n`requires`
      and the direction `inferred-type-placeholder → static-typing` survive all three challenges untouched;
      no challenger disputes them. What changes: the feature is narrowed to the written placeholder, the
      omitted-annotation case is split off to its own node, the statement's mechanism clause is replaced
      by the compile-time-determination ground, and the evidence becomes multi-source and cross-family.\n"
