      languages that do have the written placeholder. Scoping the feature to the written token dissolves
      the distributional contradiction (it was between senses (a) and (c)) and excludes Python by feature
      boundary rather than by a bolted-on restriction. The statement is re-grounded on the compile-time-determination
      claim the whole corpus shares [jls-se25#c00096], [pierce-attapl-2004#c00469], with the ill-formedness
      consequence [iso-iec-14882-cpp20-n4861#c00423] as the sharpest proof the placeholder cannot live
      outside a static discipline. [pierce-tapl-2002#c00669] is retained but demoted to supporting the
      reconstruction mechanism only. This retires the single-source referral: the evidence is now cross-family
      and multi-source.\n\nI did not split. The omitted-annotation case (TAPL's bare lambda) is a genuinely
      distinct feature, but it has no node yet, the proposer expressly declines to assert this edge of
      it, and challenger-a's Python evidence puts its relation to static typing in live contention — manufacturing
      that carve here on no participant's case would be worse than leaving it to be proposed properly.\n\
      \nStanding dissent is recorded because challenger-a's atomization objection is only half-discharged:
      the narrowing fixes this carve, but sense (c) still has no node and the edge it would carry is unsettled."
