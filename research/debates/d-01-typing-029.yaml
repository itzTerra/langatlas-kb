  revision:
    statement: An inferred-type placeholder leaves the type unwritten at a position where the 
      language still fixes it before execution — whether by local deduction from an initializer or 
      by whole-term reconstruction — so the feature presupposes a compile-time typing discipline. 
      Scoped to a token written in a type position (Rust `_`, GHC wildcards, C/C++ `auto`, C#/Java 
      `var`); a wholly omitted annotation is a distinct feature, not this one.
