  kind: feature
  id: equirecursive-types
  name: Equi-Recursive Types
  summary: A formalization of recursive types in which a recursive type is definitionally equal to 
    its own unfolding, with equivalence checked by the typechecker rather than witnessed by 
    conversions.
  evidence:
    - source: pierce-tapl-2002
      locator: §20.2
      chunk_id: pierce-tapl-2002#c00574
      quote: The equi-recursive approach takes these two type expressions as definitionally equal — 
        interchangeable in all contexts
    - source: turbak-gifford-dcpl
      locator: §11.8.6
      chunk_id: turbak-gifford-dcpl#c01066
    - source: pierce-tapl-2002
      locator: §20.2
      chunk_id: pierce-tapl-2002#c00575
      quote: The equi-recursive style is arguably more intuitive, but places stronger demands on the
        typechecker
  contested:
    - split-candidate
    - new-dimension
  debate_id:
  status: proposed
  verification:
  note: Other exclusive value of the recursive-type-formation axis.
  dimension: recursive-type-formation
