pre_challenge:
  key: subtype-polymorphism
  from_candidates:
    - subtype-polymorphism
  kind: feature
  id: subtype-polymorphism
  name: Subtype Polymorphism (Inclusion Polymorphism)
  summary: Polymorphism where a value of a subtype can be used wherever a value of a non-disjoint 
    supertype is expected, via the rule of subsumption.
  evidence:
    - source: pierce-tapl-2002
      locator: §23.2
      chunk_id: pierce-tapl-2002#c00728
    - source: sebesta-copl
      locator: §9.10
      chunk_id: sebesta-copl#c00758
      quote: Subtype polymorphism means that a variable of type T can access any object of type T or
        any type derived from T.
  contested:
    - new-dimension
  debate_id:
  status: verified
  verification:
    fact_id: f-dfbba61695c2
    verdict: verified
    admissible: true
    pairs: 2
    run_id: 2026-10-17-r4-verify-01-typing-04
  note: Third value of the polymorphism-variety axis; exclusivity is multi because sources 
    explicitly note languages mix varieties (e.g. Java has subtyping+overloading, ML has 
    parametric+overloading).
  dimension: polymorphism-variety
  cross_cutting: false
  aliases:
