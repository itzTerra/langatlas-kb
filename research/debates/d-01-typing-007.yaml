  revision:
    dimension:
    summary: A static type system enriched with a single designated type `dyn`, described by Harper 
      as embedding dynamic typing within static typing rather than opposing it; `dyn`'s values carry
      run-time class tags via explicit new/cast/inst operations.
    note: "Not a sibling discipline-value: Harper's own argument (harper-pfpl#c00361, #c00399, #c00346)
      is that hybrid typing dissolves the static/dynamic opposition by embedding dyn as one type within
      an otherwise static system, which the discipline axis's exclusive-value model cannot represent.
      The prior contrast with gradual typing is removed pending a source that actually compares the two
      mechanisms."
  structure_element: dimension-model
