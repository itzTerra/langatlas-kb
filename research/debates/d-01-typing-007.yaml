  kind: feature
  id: hybrid-typing
  name: Hybrid Typing
  summary: A language design combining statically typed and dynamically typed fragments within one 
    type system, mediated by a designated dynamic type whose values carry run-time class tags.
  evidence:
    - source: harper-pfpl
      locator: §24.1
      chunk_id: harper-pfpl#c00362
