  revision:
    note: "The classic axis of when type checking happens, treated here as a binary design commitment
      between static and dynamic typing (Van Roy & Haridi; Turbak & Gifford's 'source of great debate').
      Narrowed from an earlier four-value draft: gradual typing (Krishnamurthi's micro/macro annotation-mixing
      or sibling-language migration) and hybrid typing (Harper's dyn-type embedding within an otherwise
      static language) are not peer disciplines alongside static/dynamic — Harper's own cited chapter
      treats dynamic-in-static (hybrid) as subsumption, not opposition — and belong in their own concept-level
      carve(s) rather than as exclusive co-equal values here. Mixed/hard-to-classify languages (e.g. Java's
      load-time checks, reflection, downcasts) are not assumed to have a home on this axis and should
      get their own characteristic."
  contradiction:
    participants:
      - citation:harper-pfpl:§24.4
      - citation:vanroy-haridi-2003:#c00236
      - citation:turbak-gifford-dcpl:#c00958
    detail: Harper argues static and dynamic typing are not opposed alternatives at all — dynamic 
      typing is subsumed as a degenerate, single-type case of static typing ('dynamic typing is a 
      mode of use of static typing,' harper-pfpl#c00361/#c00346/#c00399; §24.4 rejects the 'supposed
      distinctions' between them). Van Roy & Haridi and Turbak & Gifford instead treat static vs. 
      dynamic as the classic opposed binary of the field ('a source of great debate in the 
      programming language community,' turbak-gifford-dcpl#c00958). Nothing in either source 
      resolves this tension; it is a genuine disagreement about whether the axis's two poles are 
      opposed alternatives or nested special cases.
