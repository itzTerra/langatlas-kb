  revision:
    note: A design choice on the when-is-typing-checked axis, so carved at layer 3 with a dimension 
      rather than as a bare semantic property. The dimension admits a third hybrid/mixed value 
      alongside the static and dynamic poles (languages that mix both, e.g. Java), per Van Roy & 
      Haridi's explicit three-way framing ("dynamically typed, statically typed, or some mixture of 
      both") and Turbak & Gifford's discussion of intermediate cases — this carve is one pole of 
      that axis, not an exhaustive binary. Scott (PLP) instead bundles static typing with strong 
      typing by strict definition ("statically typed if it is strongly typed and type checking can 
      be performed at compile time"), a documented alternative usage flagged here for readers 
      checking edge cases (e.g. Pascal's untagged variant records) against the KB; Scott's own 
      practical usage retreats to the clean checked-before-execution criterion, which is why the 
      carve follows the majority atomization used elsewhere in the corpus (Cardelli & Wegner, Turbak
      & Gifford, Pierce, Van Roy & Haridi) rather than folding strength into this node. Separately, 
      Harper (PFPL) argues dynamic typing is better modeled as a restricted mode of use of static 
      typing (subsumption) rather than a symmetric opposed pole — a foundational caveat on the 
      theoretical relationship between the two poles that the dimension's practical design-axis 
      framing does not resolve; it is noted rather than adopted, since Harper's own classificatory 
      prose, like the rest of the corpus, continues to use "statically typed"/"dynamically typed" as
      alternatives when classifying real languages.
  contradiction:
    participants:
      - citation:harper-pfpl:p.235
      - citation:stroustrup-de-cpp-1994:§Review
    detail: Stroustrup (quoted as this carve's own evidence) frames static typing as standing in 
      direct opposition to dynamic typing ("static (as opposed to dynamic)"), encoding a symmetric 
      two-pole axis. Harper (PFPL pp.225-226, 235) explicitly denies this opposition, arguing 
      dynamic typing is a restricted mode of use of static typing (subsumption, via the `dyn` 
      recursive type), not a competing alternative on a shared axis. Both are genuine, sourced 
      positions about the same relationship (how static and dynamic typing relate to each other) and
      neither source backs down from its framing — Harper keeps the practical static/dynamic 
      vocabulary for classifying languages while still rejecting the opposition reading, and 
      Stroustrup's phrasing is exactly the 'apparent opposition' Harper argues against. The revision
      notes this tension rather than resolving it.
