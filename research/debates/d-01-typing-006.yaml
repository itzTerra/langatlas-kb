  revision:
    summary: A discipline in which a program is made progressively more statically typed over time, 
      either by freely intermixing typed and untyped code within one language (micro gradual typing)
      or by migrating code between sibling typed/dynamic languages at import boundaries (macro 
      gradual typing).
