  revision:
    summary: A contested discourse axis judging a language by how reliably it detects or disallows 
      type misuses, defined inconsistently and sometimes operationally incompatibly across sources —
      ranging from graded, enforcement/loophole-based accounts (Cardelli & Wegner, Scott, Sebesta) 
      to a binary, proof-theoretic criterion (Harper's Preservation+Progress safety theorem). 
      Treated here as a terminological node documenting the disagreement, not as a concept with one 
      agreed identity criterion.
    note: "Kept as a single terminological concept node rather than split per source tradition, because
      the sources jointly document one named, widely-invoked discourse axis rather than several unrelated
      ideas sharing a name by accident (Kaijanaho explicitly frames it this way; Harper's formal safety-theorem
      treatment and the folk strong/weak vocabulary point at the same underlying concern from different
      formality levels). However, the sources give operationally incompatible classifiers, not just differently-worded
      versions of one test: type-consistency-of-expressions (Cardelli & Wegner), graded enforcement/loophole
      coverage (Scott), all-errors-always-detected (Sebesta), enforcement-exists-at-all lumping static+dynamic
      (Van Roy & Haridi), and a binary proved syntactic theorem (Harper) — these can disagree on the same
      language. This concept therefore has no single stable criterion for feature instances to realize.
      Any future feature-instance or feature work authored against this concept must explicitly name which
      source's criterion it is satisfying; it must not treat the node as a shared yardstick. Whether this
      eventually warrants a per-tradition split is an open design question, not resolved by this note."
  structure_element: concept-feature-split
