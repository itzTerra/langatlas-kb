messages:
  - seq: 1
    role: proposer
    persona: the ontologist
    text: "**Case for the carve**\n\nThe cited passage is exactly on point and is the canonical origin
      of this terminology. Cardelli & Wegner write: \"Strachey distinguished, informally, between two
      major kinds of polymorphism. Parametric polymorphism is obtained when a function works uniformly
      on a range of types... Ad-hoc polymorphism is obtained when a function works, or appears to work,
      on several different types... and may behave in unrelated ways for each type.\" [cardelli-wegner-1985#c00011]\n\
      \nThat sentence alone satisfies every clause of the statement:\n\n- **\"historically distinguished\"\
      ** — the passage explicitly frames this as Strachey's (1967) original, named distinction, which
      C&W are reporting and then refining, not inventing. The word \"historically\" in the carve statement
      correctly hedges to this lineage rather than claiming it's the final word.\n- **\"two... answers
      to how a single piece of code can take many types\"** — this is a direct paraphrase of the shared
      framing problem both mechanisms solve: C&W repeatedly treat overloading/coercion (ad-hoc) and parameterization
      (parametric) as alternative ways of \"relaxing a monomorphic type system\" so that \"the same symbol...
      have many types\" [cardelli-wegner-1985#c00014], [cardelli-wegner-1985#c00015].\n- **\"mutually
      distinct\"** — the text goes out of its way to contrast the two by mechanism, not just by name:
      a universally polymorphic (parametric) function \"will execute the same code for arguments of any
      admissible type,\" while \"an ad-hoc polymorphic function may execute different code for each type
      of argument\" [cardelli-wegner-1985#c00011]/[cardelli-wegner-1985#c00012]. It even contrasts their
      underlying metaphysics — parametric lets you assert \"with confidence that some values... have many
      types,\" whereas for ad-hoc \"this is more difficult to maintain, as one may take the position that
      an ad-hoc polymorphic function is really a small set of monomorphic functions\" [cardelli-wegner-1985#c00011].
      These are not just different labels for the same thing; they are presented as different, non-overlapping
      solutions.\n\nThis also supports the edge type `alternative-to` specifically, beyond mere taxonomy-sibling
      status: parametric polymorphism is explicitly called \"the purest form of polymorphism\" that needs
      \"no... coercions... or special encodings,\" [cardelli-wegner-1985#c00017] precisely because ad-hoc
      polymorphism (coercion/overloading) is the mechanism used when that uniform structure is *not* available
      — they are presented as competing answers to the same design problem, where a language typically
      leans on one or the other for a given call site.\n\nOn the \"single-source\" flag: this isn't evidentiary
      thinness so much as the fact that Cardelli & Wegner (1985), reporting Strachey (1967), simply *is*
      the source of this exact dichotomy — it's the paper everyone else in the type-theory literature
      cites for this distinction. A second citation would likely just be someone else citing C&W/Strachey
      in turn, not independent corroboration. I'd welcome a corpus cross-check, but I don't think single-sourcing
      here signals a shaky claim — it signals we've gone to the origin.\n\nI'll hold my second message
      for any challenge."
  - seq: 2
    role: challenger-a
    persona: the type theorist
    text: The core citation is strong and precisely supports the historical/terminological content 
      of the statement — no quarrel there. My one objection is about where this distinction sits in 
      the ontology's own layer model, not about the sources' accuracy.
    challenges:
      - type: wrong-layer
        text: "Cardelli & Wegner don't present 'parametric polymorphism' and 'ad-hoc polymorphism' as
          two sibling features realized within languages; they present them as the two top branches of
          a theoretical taxonomy of polymorphism ('Strachey distinguished... two major kinds of polymorphism'),
          which they then further refine into sub-kinds — ad-hoc splits into overloading and coercion,
          and universal (not ad-hoc) pairs with inclusion polymorphism as the other major subcategory.
          The concrete, language-realizable things in this picture are one level down: generic functions/parametric
          types realize parametric polymorphism, operator overloading and coercion rules realize ad-hoc
          polymorphism. Per this project's own terminology, a 'concept' is an idea/principle (often theory-grounded)
          and a 'feature' is a realization of a concept within a family of languages. C&W's passage reads
          as exactly a concept-level classification scheme (kind-of relations: ad-hoc ⊃ {overloading,
          coercion}; universal ⊃ {parametric, inclusion}), not a pair of co-equal features. Carving 'ad-hoc-polymorphism'
          and 'parametric-polymorphism' as two feature nodes joined by a feature-to-feature alternative-to
          edge treats classification labels as if they were realizable mechanisms, which risks either
          double-counting against the more concrete overloading/coercion/generics features that presumably
          already exist as features elsewhere in the KB, or leaving those concrete features with no home
          because the taxonomy nodes above them were mistaken for the features themselves."
        evidence:
          - source: cardelli-wegner-1985
            locator: pp. 4–5
            chunk_id: cardelli-wegner-1985#c00011
          - source: cardelli-wegner-1985
            locator: p. 5
            chunk_id: cardelli-wegner-1985#c00012
            quote: There are two major kinds of universal polymorphism, i.e., two major ways in 
              which a value can have many types.
          - source: cardelli-wegner-1985
            locator: p. 5
            chunk_id: cardelli-wegner-1985#c00013
  - seq: 3
    role: challenger-b
    persona: the working language implementer
    text: "The cited passage does establish Strachey's informal parametric/ad-hoc split, but the same
      pp.4–5 excerpt the proposer quotes shows Cardelli & Wegner immediately superseding that flat binary
      with a hierarchical taxonomy: ad-hoc is contrasted not with parametric alone but with \"universal
      polymorphism\" as a whole, of which parametric is only one of two subcategories (sibling: inclusion
      polymorphism) [cardelli-wegner-1985#c00011]; and ad-hoc itself splits into overloading and coercion
      [cardelli-wegner-1985#c00013]. C&W state explicitly: \"Parametric and inclusion polymorphism are
      classified as the two major subcategories of universal polymorphism, which is contrasted with nonuniversal
      or ad-hoc polymorphism\" [cardelli-wegner-1985#c00011], and later: \"There are two major kinds of
      universal polymorphism... parametric polymorphism... inclusion polymorphism\" [cardelli-wegner-1985#c00012].
      So in the source's own refined (not merely historical/Strachey) view, the real top-level alternative-to
      pair is universal-polymorphism vs ad-hoc-polymorphism, with parametric and inclusion as finer-grained
      siblings one level down, and overloading/coercion as siblings under ad-hoc. Treating \"ad-hoc-polymorphism\"\
      \ and \"parametric-polymorphism\" as the two mutually exclusive leaves of the taxonomy skips over
      inclusion polymorphism and picks nodes from two different levels of the same tree, which is not
      the atomization the cited passage itself uses once it moves past attributing the naive two-way split
      to Strachey."
    challenges:
      - type: wrong-atomization
        text: The carve flattens C&W's own hierarchical taxonomy (universal polymorphism 
          {parametric, inclusion} vs. ad-hoc polymorphism {overloading, coercion}) into a direct 
          binary between parametric and ad-hoc. The passage cited as sole evidence is exactly where 
          C&W state they are refining Strachey's naive two-way split by adding inclusion 
          polymorphism as parametric's sibling under 'universal polymorphism,' making the true 
          top-level alternative-to pair universal-vs-ad-hoc, not parametric-vs-ad-hoc. The carve's 
          'mutually distinct...two answers' statement reads like the final taxonomy when it is 
          actually the superseded, informal starting point the source immediately complicates.
        evidence:
          - source: cardelli-wegner-1985
            locator: pp. 4–5
            chunk_id: cardelli-wegner-1985#c00011
          - source: cardelli-wegner-1985
            locator: p. 5
            chunk_id: cardelli-wegner-1985#c00012
          - source: cardelli-wegner-1985
            locator: p. 5
            chunk_id: cardelli-wegner-1985#c00013
  - seq: 4
    role: proposer
    persona: the ontologist
    text: "Both challenges are correct, and I concede the carve as drafted.\n\nThe cited passage [cardelli-wegner-1985#c00011]
      is explicit that Strachey's \"parametric vs. ad-hoc\" split is the *informal* starting point, which
      C&W immediately *refine*: \"Our classification of polymorphism in Figure 1 refines that of Strachey
      by introducing a new form of polymorphism called inclusion polymorphism... Parametric and inclusion
      polymorphism are classified as the two major subcategories of universal polymorphism, which is contrasted
      with nonuniversal or ad-hoc polymorphism.\" The top-level binary in C&W's own taxonomy is universal-vs-ad-hoc,
      not parametric-vs-ad-hoc — parametric polymorphism is one level down, as inclusion polymorphism's
      sibling under \"universal.\" So the working language implementer's wrong-atomization point is directly
      supported by the primary source: the carve's \"mutually distinct...two answers\" statement describes
      Strachey's superseded framing, not C&W's actual classification, and picks the wrong pair for a top-level
      alternative-to edge.\n\nThe type theorist's wrong-layer point is also borne out: this whole passage,
      including the ad-hoc/universal split and its sub-splits, is a *classification scheme* (\"kind-of\"\
      \ taxonomy), not a description of two co-equal realizable mechanisms. C&W's own text treats the
      concrete, language-visible things as one level further down still: \"Overloading... Coercion...
      Subtyping [= inclusion]... Value sharing [= parametric]\" [cardelli-wegner-1985#c00015], and separately
      frames parametric polymorphism as realized via \"generic functions\"/ML-style type variables [cardelli-wegner-1985#c00025],
      overloading/coercion as the ad-hoc mechanisms [cardelli-wegner-1985#c00016, #c00018]. Per this project's
      own concept/feature terminology, \"parametric polymorphism\" and \"ad-hoc polymorphism\" as named
      in this passage are concept-level taxonomy labels, not features; the realizable features are generics/parametric
      types vs. overloading vs. coercion vs. subtyping.\n\nI don't think there's a defensible repair that
      keeps this exact edge. The source simply doesn't support \"parametric\" and \"ad-hoc\" as the two
      siblings at any level — not at the top (that's universal vs. ad-hoc) and not at a feature-realization
      level (that's generics vs. {overloading, coercion}, with inclusion/subtyping as a third branch under
      universal, not under ad-hoc at all). Recommend retiring this carve. If an alternative-to edge is
      wanted at the concept layer, it should be universal-polymorphism--alternative-to--ad-hoc-polymorphism,
      sourced to the same passage; if wanted at the feature layer, it should connect the concrete mechanisms
      (e.g. generic-functions / parametric-types vs. operator-overloading, and separately vs. coercion),
      each needing its own check against whatever feature nodes already exist in the KB to avoid the double-counting
      risk the type theorist flagged."
  - seq: 5
    role: moderator
    persona: the moderator
    text: "The proposer's own citation, read in full, undercuts the carve. C&W pp.4-5 present Strachey's
      flat parametric-vs-ad-hoc split only as the informal starting point they immediately refine: \"\
      Our classification... refines that of Strachey by introducing... inclusion polymorphism... Parametric
      and inclusion polymorphism are classified as the two major subcategories of universal polymorphism,
      which is contrasted with nonuniversal or ad-hoc polymorphism\" [cardelli-wegner-1985#c00011]. So
      in the source's own settled taxonomy the top-level alternative-to pair is universal-polymorphism
      vs ad-hoc-polymorphism, with parametric sitting one level down as inclusion's sibling under \"universal\"\
      \ (challenger-b's wrong-atomization, upheld). Separately, this whole passage is a theoretical kind-of
      classification (ad-hoc ⊃ {overloading, coercion}; universal ⊃ {parametric, inclusion}), not a description
      of two co-equal language-realizable mechanisms; per the project's own concept/feature vocabulary
      these are concept-level taxonomy labels, and the actually realizable things are generics/parametric-types,
      overloading, coercion, and subtyping one level further down (challenger-a's wrong-layer, upheld).
      The proposer concedes both points directly and recommends retiring the carve, noting that any replacement
      — a concept-layer universal-vs-ad-hoc edge, or feature-layer edges among the concrete mechanisms
      — needs its own sourcing and a check against whatever feature nodes already exist in the KB to avoid
      double-counting. That is new design work, not a mechanical revision of this carve, so it belongs
      in fresh carve proposals rather than a `revision`/`split` patch here."
