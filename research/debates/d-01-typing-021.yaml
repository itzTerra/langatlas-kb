  revision:
    statement: Gradual typing requires a static type-checking discipline to be applied to the typed 
      portion of the program — whether realized as in-line checking of annotated code commingled 
      with untyped code (the micro variant) or as a fully statically typed sibling language whose 
      values cross a run-time contract boundary into an untyped sibling (the macro variant, e.g. 
      Typed Racket).
