    remainder in the language lacking a static discipline, so the `to` side is a discipline and not a
    mere absence of annotations. I reject the type theorist's framing of micro's remainder as only \"\
    an unannotated remainder\"; #c00240 does not support that reading.\n\nThe carve is therefore narrowed
    to the micro branch. For the structure review: holding the macro claim would require a record kind
    whose bearer is a language pair (or a cross-artifact edge type between two feature instances in different
    languages, with the value-crossing boundary and divergent construct sets as its payload). Until that
    exists, the macro dependency is unrecorded.\n\nStanding dissent is recorded: the macro dependency,
    which the source treats as the canonical school, is left out of the knowledge base by this decision,
    and the single-source flag on what remains is live."
  revision:
    statement: 'Micro gradual typing requires that the unannotated parts of the same program remain dynamically
      typed: annotations may be added to any subset of variables, so statically and dynamically typed
