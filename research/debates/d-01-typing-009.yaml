  kind: feature
  id: nominal-typing
  name: Nominal Typing
  summary: A discipline, as in Java, in which subtyping and type equivalence require explicit, 
    name-based declaration rather than structural comparison.
  evidence:
    - source: pierce-tapl-2002
      locator: §19.3
      chunk_id: pierce-tapl-2002#c00525
    - source: pierce-tapl-2002
      locator: §19.3
