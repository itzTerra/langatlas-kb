  revision:
    statement: Static and dynamic typing are the two poles of when and how a language checks that 
      operations are applied to compatible types; most languages are classifiable as predominantly 
      one or the other, but the choice is not all-or-nothing, and hybrid/gradual designs (e.g., 
      Typed Racket, TypeScript) deliberately occupy the middle.
  structure_element: edge-types
  contradiction:
    participants:
      - citation:vanroy-haridi-2003:§2.7.3 (c00236)
      - citation:vanroy-haridi-2003:§2.7.3 (c00239)
    detail: The anchor source's own text frames static/dynamic typing both as "two major families"/a
      binary design decision (c00236) and, in the same subsection, explicitly denies that the choice
      is all-or-nothing, since each approach can incorporate a bit of the other (c00239). This 
      internal tension is what the carve's exclusivity framing fails to carry, and is reinforced 
      externally by Harper's claim that the opposition is illusory/harmonious (harper-pfpl) and 
      Krishnamurthi's documentation of shipped gradual/hybrid languages.
