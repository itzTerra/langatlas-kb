id: d-01-typing-020
cycle: 1
theme: typing
target:
  list: edges
  key: dynamic-typing--alternative-to--static-typing
opened: '2026-10-17'
runs:
  debate: 2026-10-17-r4-debate-01-typing-dynamic-typing--alternative-to--static-typing-01
  moderator: 2026-10-17-r4-moderator-01-typing-dynamic-typing--alternative-to--static-typing-01
