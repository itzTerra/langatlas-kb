    note: "Strachey's classification (via Cardelli & Wegner, via Pierce) of parametric, subtype/inclusion,
      and ad-hoc polymorphism as mutually comparable but freely combinable mechanisms a language may adopt
      — with ad-hoc polymorphism itself resolved, per Cardelli & Wegner's explicit sub-division (independently
