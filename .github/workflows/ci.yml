name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install packages
        run: |
          uv --directory tools/validate sync --extra dev
          uv --directory tools/pipeline sync
          uv --directory tools/ingest sync
          uv --directory tools/finding-aids sync --extra dev
          uv --directory tools/research sync --extra dev
          uv --directory tools/orchestrator sync --extra dev
          uv --directory tools/questionnaire sync --extra dev
      - name: Test the finding-aids package
        # No database and no network: every adapter takes an injected client, and the
        # `live` marker is deselected by default.
        run: uv --directory tools/finding-aids run pytest
      - name: Test the research package
        # No database, no provider; the `git`-marked tests build throwaway local repos.
        run: uv --directory tools/research run pytest -m ''
      - name: Test the questionnaire compiler
        # No database, no provider: the compiler is a pure function of the store tree.
        run: uv --directory tools/questionnaire run pytest
      - name: Schema-check the committed questionnaire specs
        run: uv --directory tools/questionnaire run langatlas-questionnaire validate
      - name: Test the validate package
        # No database, no provider. Stage 3D added the controversy-block gate and the
        # machine-field exemption in `version-bump`, both of which are pure-Python checks.
        run: uv --directory tools/validate run pytest
      - name: Test the R3 tagging job kind
        # Only the Stage 3B orchestrator tests: no database (the job's DB call is replaced),
        # no provider. The rest of the orchestrator suite keeps its existing local-only status.
        run: >-
          uv --directory tools/orchestrator run pytest
          tests/test_r3_tagging_job.py tests/test_controversy_job.py tests/test_driver_overrides.py
      - name: Run the store-validating gate
        run: uv --directory tools/validate run langatlas-validate ci
      - name: Shape-check the committed golden sets
        # Shape only: no database, no provider. The *scored* harness is deliberately not
        # a CI gate (§8.6) — a golden run is a measurement, not a merge condition.
        run: uv --directory tools/ingest run langatlas-sources golden-validate
      - name: Check the verification canary list
        # No database, no provider: only that every canary id still names a committed
        # golden item. A canary pointing at a deleted item would silently stop guarding.
        run: uv --directory tools/ingest run langatlas-verify canaries --check

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install packages
        run: uv --directory tools/validate sync
      - name: Compile the dataset bundle
        run: uv --directory tools/validate run langatlas-publish --out dataset.json
      - name: Compute today's data-vN tag
        id: tag
        run: |
          TAG=$(uv --directory tools/validate run python -c \
            "from langatlas_validate.publish_cli import data_vn_tag_for_today; print(data_vn_tag_for_today())")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Move the latest-green rolling tag
        run: |
          git tag -f latest-green
          git push -f origin latest-green
      - name: Publish latest-green release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-green
          files: dataset.json
          make_latest: false
      - name: Cut today's data-vN tag if it doesn't already exist (daily, changes-only)
        id: cut_tag
        run: |
          if git ls-remote --exit-code --tags origin "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "tag already exists, skipping (no changes today or already published)"
            echo "cut=false" >> "$GITHUB_OUTPUT"
          else
            git tag "${{ steps.tag.outputs.tag }}"
            git push origin "${{ steps.tag.outputs.tag }}"
            echo "cut=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish data-vN release asset
        if: steps.cut_tag.outputs.cut == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dataset.json
          make_latest: false
      - name: Dispatch to langatlas-site (best-effort; site has nothing to consume yet)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.LANGATLAS_SITE_DISPATCH_TOKEN }}
        run: |
          gh api repos/langatlas/langatlas-site/dispatches \
            -f event_type=kb-updated \
            -f client_payload[tag]="${{ steps.tag.outputs.tag }}" \
            -f client_payload[sha]="${{ github.sha }}"

  version:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v3
      - run: uv --directory tools/validate sync
      - name: Auto-bump the 0.x ontology version (§5.1)
        # The bump commit touches only ontology/VERSION and ontology/CHANGELOG.md, neither
        # of which is in STORE_DIRS — so the next run classifies "none" and writes nothing.
        # No loop, no [skip ci] needed.
        run: |
          uv --directory tools/validate run langatlas-validate version-bump \
            --since HEAD~1 --apply
          if ! git diff --quiet -- ontology/VERSION; then
            git config user.name "langatlas-bot"
            git config user.email "bot@langatlas.dev"
            git add ontology/VERSION ontology/CHANGELOG.md
            git commit -m "chore: bump ontology version"
            git push origin HEAD:main
          fi
